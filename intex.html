<!DOCTYPE html> <!--descreve a linguagem de programação que está sendo utilizada, nesse caso é o HTML-->
<html lang="pt-br"> <!--início do documento-->
<head> <!-- define o cabeçalho do do documento. O cponteúdo descrito aqui não aparece no navegador. essa tag serve para inserir folhas de estilo e scripts-->
    <meta charset="UTF-8"><!--indica quais serão os caracteres (character set ou charset)será utilizado para rendenizar o texto da página-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--fornece os metadados do site para o navegador-->
    <title>Portifóloio</title> <!--título do documento-->
</head> <!--fechamento do cabeçalho do documento-->
<!--Um documento HTML é composto por tags que são escritas entre < >. As tags precisam ser abertas e fechadas, o que as diferenciam é que as tagas de fechamento possuem uma \ antes do nome.-->
<body><!--é o espaço em que todas as tags devem ser colocadas. O conteúdo aqui contido é o visual da página. As tags que representam textos, botões e outros devem ser adicionadas nesse intervalo.-->
</body>
</html> <!--fim do documento-->
